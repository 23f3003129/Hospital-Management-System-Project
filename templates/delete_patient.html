<!DOCTYPE html>
<html>
<head>
  <title>Delete Patient</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card p-4 shadow-sm">
      <h3 class="mb-3 text-danger">Confirm Delete</h3>
      <p>Are you sure you want to delete patient <strong>{{ patient.name }}</strong> (ID: {{ patient.uid }})?</p>
      <div class="d-flex gap-2">
        <a href="/confirm_delete_patient/{{ patient.uid }}" class="btn btn-danger">Yes, Delete</a>
        <a href="/admin/patients" class="btn btn-secondary">Cancel</a>
      </div>
      <div class="mt-3 text-muted" style="font-size: 0.9rem;">
        Note: You cannot delete a patient who has existing appointments.
      </div>
    </div>
  </div>
</body>
</html>
