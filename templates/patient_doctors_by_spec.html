<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctors — {{ specialization }}</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:#f7f7f8; color:#111; }
    header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; background:#fff; border-bottom:1px solid #e5e7eb; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .card { background:#fff; border:1px solid #e5e7eb; border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:6px; }
    .btn { display:inline-block; text-decoration:none; border:1px solid #111; color:#fff; background:#111; padding:10px 12px; border-radius:12px; font-size:14px; }
    .muted { color:#555; font-size:14px; }
  </style>
</head>
<body>
  <header>
    <div style="font-weight:800;">🏥 HMS — {{ specialization }}</div>
    <a href="{{ url_for('patient_departments') }}" style="text-decoration:none;">← Back to Departments</a>
  </header>

  <div class="wrap">
    <h2 style="margin:8px 0 12px;">Doctors in {{ specialization }}</h2>

    {% if doctors %}
      <div class="grid">
        {% for d in doctors %}
          <div class="card">
            <div style="font-weight:700;">Dr. {{ d.name }}</div>
            <div class="muted">Department: {{ d.specialization }}</div>

            <div style="display:flex; gap:8px; margin-top:8px;">
  
              <!-- New: View Profile -->
              <a class="btn" style="background:#444;" 
                href="{{ url_for('patient_doctor_profile', doctor_id=d.uid) }}">
                View Profile
              </a>

              <!-- Existing: View Slots -->
              <a class="btn" href="{{ url_for('patient_doctor_slots', doctor_id=d.uid) }}">
                View Slots
              </a>

            </div>


          </div>
        {% endfor %}
      </div>
    {% else %}
      <div class="muted">No doctors found in this department.</div>
    {% endif %}
  </div>
</body>
</html>
