<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Departments</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:#f7f7f8; color:#111; }
    header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; background:#fff; border-bottom:1px solid #e5e7eb; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .card { background:#fff; border:1px solid #e5e7eb; border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:6px; }
    .btn { display:inline-block; text-decoration:none; border:1px solid #111; color:#fff; background:#111; padding:10px 12px; border-radius:12px; font-size:14px; }
    .muted { color:#555; font-size:14px; }
  </style>
</head>
<body>
  <header>
    <div style="font-weight:800;">🏥 HMS — Departments</div>
    <a href="{{ url_for('userdashboard') }}" style="text-decoration:none;">← Back to Dashboard</a>
  </header>

  <div class="wrap">
    <h2 style="margin:8px 0 12px;">Browse Departments</h2>

    {% if departments %}
      <div class="grid">
        {% for spec in departments %}
          <div class="card">
            <div style="font-weight:700;">{{ spec }}</div>
            <div class="muted">Department</div>

            <div style="margin-top:8px;">
              <a class="btn" href="{{ url_for('patient_doctors_by_spec', specialization=spec) }}">
                View Doctors
              </a>
            </div>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <div class="muted">No departments found.</div>
    {% endif %}
  </div>
</body>
</html>
