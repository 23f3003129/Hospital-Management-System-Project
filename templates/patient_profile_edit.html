<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Profile</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f2f4f8; margin:0; }
    header { background:#0066cc; color:#fff; padding:1rem 2rem; display:flex; justify-content:space-between; align-items:center; }
    main { padding:2rem; }
    form { background:#fff; border-radius:10px; padding:1.5rem; box-shadow:0 2px 5px rgba(0,0,0,.1); max-width:700px; }
    .row { display:grid; grid-template-columns: 160px 1fr; gap:10px; margin:.6rem 0; align-items:center; }
    input, select { padding:8px; border:1px solid #ccc; border-radius:6px; width:100%; }
    .btn { background:#0066cc; color:#fff; padding:10px 16px; border-radius:6px; text-decoration:none; border:none; cursor:pointer; }
    .btn:hover { background:#004c99; }
    .muted { color:#666; font-size:.9rem; }
    .actions { display:flex; gap:10px; margin-top:10px; }
  </style>
</head>
<body>
  <header>
    <h2>Edit Profile</h2>
    <div>
      <a href="/patient/profile" class="btn">Back to Profile</a>
    </div>
  </header>

  <main>
    <form method="post" action="/patient/profile/edit">
      <div class="row">
        <label for="name">Name</label>
        <input id="name" name="name" value="{{ patient.name }}" required />
      </div>

      <div class="row">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ patient.email }}" required />
      </div>

      <div class="row">
        <label for="age">Age</label>
        <input id="age" name="age" type="number" min="0" value="{{ patient.age }}" />
      </div>

      <div class="row">
        <label for="gender">Gender</label>
        <select id="gender" name="gender">
          <option value="">-- Select --</option>
          <option value="Male"   {% if patient.gender=='Male' %}selected{% endif %}>Male</option>
          <option value="Female" {% if patient.gender=='Female' %}selected{% endif %}>Female</option>
          <option value="Other"  {% if patient.gender=='Other' %}selected{% endif %}>Other</option>
        </select>
      </div>

      <hr style="margin:16px 0; border:none; border-top:1px solid #eee" />

      <div class="row">
        <div class="muted">Change Password (optional)</div>
        <div class="muted">Fill all three fields to change your password.</div>
      </div>

      <div class="row">
        <label for="current_password">Current Password</label>
        <input id="current_password" name="current_password" type="password" autocomplete="current-password" />
      </div>

      <div class="row">
        <label for="new_password">New Password</label>
        <input id="new_password" name="new_password" type="password" autocomplete="new-password" />
      </div>

      <div class="row">
        <label for="confirm_new_password">Confirm New Password</label>
        <input id="confirm_new_password" name="confirm_new_password" type="password" autocomplete="new-password" />
      </div>

      <div class="actions">
        <button class="btn" type="submit">Save Changes</button>
        <a class="btn" href="/patient/profile" style="background:#777;">Cancel</a>
      </div>
    </form>
  </main>
</body>
</html>
