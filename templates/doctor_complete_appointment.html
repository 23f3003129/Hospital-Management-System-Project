<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Complete Appointment</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:#f7f7f8; color:#111; }
    header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; background:#fff; border-bottom:1px solid #e5e7eb; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 16px; }
    .card { background:#fff; border:1px solid #e5e7eb; border-radius:14px; padding:16px; }
    label { display:block; font-weight:600; margin-top:12px; margin-bottom:6px; }
    textarea { width:100%; min-height:100px; padding:10px; border:1px solid #e5e7eb; border-radius:10px; resize:vertical; }
    .row { display:flex; gap:16px; flex-wrap:wrap; }
    .btn { border:0; background:#111; color:#fff; padding:10px 14px; border-radius:10px; cursor:pointer; }
    .btn-secondary { background:#6b7280; }
    .pill { padding:6px 10px; border-radius:999px; background:#f3f4f6; font-size:12px; color:#374151; }
  </style>
</head>
<body>
  <header>
    <div style="font-weight:800;">🏥 HMS — Complete Appointment</div>
    <a href="{{ url_for('doctordashboard') }}" style="text-decoration:none;">← Back to Dashboard</a>
  </header>

  <div class="wrap">
    <div class="card">
      <div class="row" style="justify-content:space-between; align-items:center;">
        <div>
          <div style="font-weight:700; font-size:18px;">Appointment #{{ appt.aid }}</div>
          <div class="pill" style="margin-top:6px;">
            {{ appt.slot.date.strftime('%Y-%m-%d') }} · {{ appt.slot.time.strftime('%H:%M') }}
          </div>
        </div>
        <div class="pill">Patient: {{ appt.patient.name }}</div>
      </div>

      <form method="post" action="{{ url_for('doctor_complete_appointment', aid=appt.aid) }}" style="margin-top:16px;">
        <label for="diagnosis">Diagnosis</label>
        <textarea id="diagnosis" name="diagnosis" placeholder="Enter diagnosis...">{{ appt.diagnosis or "" }}</textarea>

        <label for="prescription">Prescription</label>
        <textarea id="prescription" name="prescription" placeholder="Enter prescription...">{{ appt.prescription or "" }}</textarea>

        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" placeholder="Any additional notes...">{{ appt.notes or "" }}</textarea>

        <div class="row" style="margin-top:16px;">
          <button type="submit" class="btn">Mark as Completed</button>
          <a href="{{ url_for('doctordashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
