<!DOCTYPE html>
<html>
<head>
    <title>Update Patient</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <h2 class="mb-4">Update Patient Information</h2>

    <form action="" method="POST" class="card p-4 shadow-sm">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" value="{{ patient.name }}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Age</label>
            <input type="number" name="age" value="{{ patient.age }}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Gender</label>
            <select name="gender" class="form-control">
                <option value="Male" {% if patient.gender=='Male' %}selected{% endif %}>Male</option>
                <option value="Female" {% if patient.gender=='Female' %}selected{% endif %}>Female</option>
                <option value="Other" {% if patient.gender=='Other' %}selected{% endif %}>Other</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" value="{{ patient.email }}" class="form-control" required>
        </div>

        <button class="btn btn-primary">Update</button>
        <a href="/admin/patients" class="btn btn-secondary ms-2">Cancel</a>

    </form>

</div>

</body>
</html>
