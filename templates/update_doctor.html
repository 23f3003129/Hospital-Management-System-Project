<!DOCTYPE html>
<html>
<head>
    <title>Update Doctor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="flash-container">
                {% for message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
    <div class="container py-5">
        <h2 class="mb-4">Update Doctor Information</h2>

        <form action="/update_doctor/{{ doctor.uid }}" method="POST" class="card p-4 shadow-sm">
            <div class="mb-3">
                <label class="form-label">Name:</label>
                <input type="text" name="name" value="{{ doctor.name }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Age:</label>
                <input type="number" name="age" value="{{ doctor.age }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Gender:</label>
                <select name="gender" class="form-select" required>
                    <option value="Male" {% if doctor.gender == "Male" %}selected{% endif %}>Male</option>
                    <option value="Female" {% if doctor.gender == "Female" %}selected{% endif %}>Female</option>
                    <option value="Other" {% if doctor.gender == "Other" %}selected{% endif %}>Other</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Email:</label>
                <input type="email" name="email" value="{{ doctor.email }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Specialization:</label>
                <input type="text" name="specialization" value="{{ doctor.specialization }}" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary">Update Doctor</button>
            <a href="/admindashboard" class="btn btn-secondary ms-2">Cancel</a>
        </form>
    </div>
</body>
</html>
