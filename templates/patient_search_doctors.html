<!DOCTYPE html>
<html>
<head>
  <title>Search Doctors</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <h2 class="mb-3">Search Doctors</h2>
  <a href="/userdashboard" class="btn btn-secondary mb-3">⬅ Back to Dashboard</a>

  <form method="GET" class="card p-3 shadow-sm mb-4">
    <label class="form-label">Search by name or specialization</label>
    <div class="d-flex gap-2">
      <input class="form-control" name="q" value="{{ q or '' }}" placeholder="e.g., Sharma or Cardiology">
      <button class="btn btn-primary" type="submit">Search</button>
    </div>
  </form>

  {% if q and not doctors %}
    <div class="alert alert-info">No doctors found for "<strong>{{ q }}</strong>".</div>
  {% endif %}

  {% if doctors %}
    <div class="card p-3 shadow-sm">
      <div class="table-responsive">
        <table class="table table-bordered align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>ID</th><th>Name</th><th>Department</th><th>Action</th>
            </tr>
          </thead>
          <tbody>
            {% for d in doctors %}
            <tr>
              <td>{{ d.uid }}</td>
              <td>Dr. {{ d.name }}</td>
              <td>{{ d.specialization or '—' }}</td>
              <td>
                <a class="btn btn-sm btn-primary" href="{{ url_for('patient_doctor_slots', doctor_id=d.uid) }}">
                  View Slots & Book
                </a>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  {% endif %}
</div>
</body>
</html>
